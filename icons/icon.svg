  <rect x="52" y="8" width="24" height="14" rx="4" fill="#0078d4"/>
  <!-- body ring -->
  <circle cx="64" cy="72" r="48" fill="#0078d4"/>
  <!-- face -->
  <circle cx="64" cy="72" r="38" fill="#ffffff"/>
